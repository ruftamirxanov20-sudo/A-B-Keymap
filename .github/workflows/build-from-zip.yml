
name: Build AZ PadView APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract project
        shell: bash
        run: |
          set -e
          ZIP_FILE="AZPadView-fixed.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 1 -type f -name 'AZPadView-lightweight-v2*.zip' -print -quit)"
          fi

          if [ -z "$ZIP_FILE" ] || [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: AZ PadView ZIP file not found."
            exit 1
          fi

          mkdir -p extracted
          unzip -oq "$ZIP_FILE" -d extracted

          PROJECT_DIR="$(find extracted -type f \( -path '*/app/build.gradle.kts' -o -path '*/app/build.gradle' \) -print -quit | sed -E 's#/app/build\.gradle(\.kts)?$##')"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android app Gradle file not found in ZIP."
            echo "ZIP contents:"
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Android project: $PROJECT_DIR"

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AZ-PadView-debug
          path: |
            extracted/**/app/build/outputs/apk/debug/*.apk
            extracted/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
